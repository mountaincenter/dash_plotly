name: Data Pipeline

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "EventBridge Scheduler mode: stock_1645 / grok_2215 / cme_0700"
        type: string
        default: ""
      skip_trading_day_check:
        description: "営業日チェックをスキップ（スケジュールに関係なく強制実行）"
        type: boolean
        default: false
      force_meta_jquants:
        description: "meta_jquants.parquetを強制更新（7日間の鮮度チェックを無視）"
        type: boolean
        default: false
      force_grok:
        description: "Grok銘柄選定を強制実行（generate_grok_trending.pyを実行）"
        type: boolean
        default: false
      force_1645_mode:
        description: "16:45モードを強制（Grok選定スキップ、バックテスト実行）"
        type: boolean
        default: false
      force_grok_skip:
        description: "22:15モードでGrok選定だけスキップ（既存grok_trending.parquetを使用）"
        type: boolean
        default: false
      force_cme_mode:
        description: "CME更新モードを強制（07:00相当）"
        type: boolean
        default: false
      skip_deploy:
        description: "検証実行ではECR deployを行わない"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    environment: AWS_OIDC

    env:
      APP_ENV: production
      STORAGE_MODE: s3
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
      S3_BUCKET: ${{ vars.DATA_BUCKET || vars.S3_BUCKET }}
      PARQUET_PREFIX: ${{ vars.PARQUET_PREFIX || 'parquet/' }}
      S3_PREFIX: ${{ vars.PARQUET_PREFIX || 'parquet/' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install jquants-cli
        run: |
          JQUANTS_VERSION="1.3.0"
          JQUANTS_SHA256="074b6be27b8e4d343a81af8d207d34e81bd30aee2dd2f5358e6ab903564d2b73"
          curl -fsSL "https://github.com/J-Quants/jquants-cli/releases/download/v${JQUANTS_VERSION}/jquants-${JQUANTS_VERSION}-x86_64-unknown-linux-musl.tar.gz" -o /tmp/jquants.tar.gz
          echo "${JQUANTS_SHA256}  /tmp/jquants.tar.gz" | sha256sum -c -
          tar -xzf /tmp/jquants.tar.gz -C /tmp/
          chmod +x /tmp/jquants
          sudo mv /tmp/jquants /usr/local/bin/jquants
          echo "✅ jquants-cli $(jquants --version) installed"
          jquants --output json schema eq.daily | python -c 'import json, sys; fields = {row["Field"] for row in json.load(sys.stdin)}; missing = {"MktCap", "ExRT", "AdjFactor"} - fields; assert not missing, f"jquants eq.daily schema missing: {sorted(missing)}"'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup J-Quants authentication
        run: |
          # .env.jquants for Python scripts
          cat > .env.jquants <<EOF
          JQUANTS_API_KEY=${{ secrets.JQUANTS_API_KEY }}
          EOF

          # credentials.json for jquants-cli binary
          mkdir -p ~/.config/jquants
          EPOCH=$(date +%s)
          printf '{"api_key":"%s","saved_at":%s}\n' "${{ secrets.JQUANTS_API_KEY }}" "$EPOCH" > ~/.config/jquants/credentials.json

          echo "✅ J-Quants authentication configured (Python + CLI)"

      - name: Force execution notice
        if: ${{ github.event.inputs.skip_trading_day_check == 'true' }}
        run: |
          echo "⚠️  FORCE EXECUTION MODE"
          echo "Trading day check has been bypassed via manual dispatch"
          echo "Pipeline will run regardless of schedule"

      - name: Determine execution mode
        id: exec_mode
        run: |
          CURRENT_HOUR=$(TZ=Asia/Tokyo date +%H)
          DISPATCH_MODE="${{ github.event.inputs.mode }}"
          echo "Current hour (JST): $CURRENT_HOUR"
          echo "Dispatch mode input: ${DISPATCH_MODE:-none}"

          # --- EventBridge Scheduler dispatch ---
          # GitHub Actions native schedule is intentionally not the primary trigger.
          # EventBridge Scheduler sends mode via workflow_dispatch inputs.
          if [ "$DISPATCH_MODE" = "stock_1645" ] || [ "$DISPATCH_MODE" = "stock_data" ]; then
            echo "mode=stock_data" >> $GITHUB_OUTPUT
            echo "skip_trading_check=false" >> $GITHUB_OUTPUT
            echo "skip_grok=true" >> $GITHUB_OUTPUT
            echo "💹 Stock Data Mode (EventBridge Scheduler 16:45 JST)"
          elif [ "$DISPATCH_MODE" = "grok_2215" ] || [ "$DISPATCH_MODE" = "grok_daily" ]; then
            echo "mode=grok_daily" >> $GITHUB_OUTPUT
            echo "skip_trading_check=true" >> $GITHUB_OUTPUT
            echo "skip_grok=false" >> $GITHUB_OUTPUT
            echo "📊 GROK Daily Mode (EventBridge Scheduler 22:15 JST)"
          elif [ "$DISPATCH_MODE" = "cme_0700" ] || [ "$DISPATCH_MODE" = "cme_update" ]; then
            echo "mode=cme_update" >> $GITHUB_OUTPUT
            echo "skip_trading_check=true" >> $GITHUB_OUTPUT
            echo "skip_grok=cme" >> $GITHUB_OUTPUT
            echo "🌅 CME Update Mode (EventBridge Scheduler 07:00 JST)"
          elif [ -n "$DISPATCH_MODE" ]; then
            echo "❌ Unknown dispatch mode: $DISPATCH_MODE"
            exit 1

          # --- dispatch (手動) ---
          # force_cme_mode が true の場合、CME更新モード
          elif [ "${{ github.event.inputs.force_cme_mode }}" = "true" ]; then
            echo "mode=cme_update" >> $GITHUB_OUTPUT
            echo "skip_trading_check=true" >> $GITHUB_OUTPUT
            echo "skip_grok=cme" >> $GITHUB_OUTPUT
            echo "🌅 FORCED CME Update Mode (07:00相当)"
          # force_grok_skip: 22:15モードでGrok選定だけスキップ
          elif [ "${{ github.event.inputs.force_grok_skip }}" = "true" ]; then
            echo "mode=grok_daily" >> $GITHUB_OUTPUT
            echo "skip_trading_check=true" >> $GITHUB_OUTPUT
            echo "skip_grok=true" >> $GITHUB_OUTPUT
            echo "📊 GROK Daily Mode (Grok selection SKIPPED, using existing grok_trending.parquet)"
          # force_1645_mode が true の場合、強制的に16:45モード（Grok選定スキップ）
          elif [ "${{ github.event.inputs.force_1645_mode }}" = "true" ]; then
            echo "mode=stock_data_forced" >> $GITHUB_OUTPUT
            echo "skip_trading_check=true" >> $GITHUB_OUTPUT
            echo "skip_grok=true" >> $GITHUB_OUTPUT
            echo "💹 FORCED 16:45 Mode - Grok selection SKIPPED, backtest ENABLED"
          # force_grok が true の場合、強制的にGROKモード
          elif [ "${{ github.event.inputs.force_grok }}" = "true" ]; then
            echo "mode=grok_forced" >> $GITHUB_OUTPUT
            echo "skip_trading_check=true" >> $GITHUB_OUTPUT
            echo "skip_grok=false" >> $GITHUB_OUTPUT
            echo "🚀 FORCED GROK Mode - Manual GROK selection execution"
          # --- schedule (cron) --- github.event.schedule で判定、壁時計はfallback
          # 22:15 JST cron (UTC 13:15) → GHA遅延で23:xx JSTになっても日付跨ぎ回避
          elif [ "${{ github.event.schedule }}" = "15 13 * * *" ]; then
            echo "mode=grok_daily" >> $GITHUB_OUTPUT
            echo "skip_trading_check=true" >> $GITHUB_OUTPUT
            echo "skip_grok=false" >> $GITHUB_OUTPUT
            echo "📊 GROK Daily Mode (scheduled 22:15 JST, actual hour: $CURRENT_HOUR)"
          # 07:00 JST cron (UTC 22:00) → CME更新モード
          elif [ "${{ github.event.schedule }}" = "0 22 * * *" ]; then
            echo "mode=cme_update" >> $GITHUB_OUTPUT
            echo "skip_trading_check=true" >> $GITHUB_OUTPUT
            echo "skip_grok=cme" >> $GITHUB_OUTPUT
            echo "🌅 CME Update Mode (scheduled 07:00 JST, actual hour: $CURRENT_HOUR)"
          # 16:45 JST cron (UTC 07:45) → stock_data モード
          elif [ "${{ github.event.schedule }}" = "45 7 * * *" ]; then
            echo "mode=stock_data" >> $GITHUB_OUTPUT
            echo "skip_trading_check=false" >> $GITHUB_OUTPUT
            echo "skip_grok=true" >> $GITHUB_OUTPUT
            echo "💹 Stock Data Mode (scheduled 16:45 JST, actual hour: $CURRENT_HOUR)"
          # --- fallback (壁時計) ---
          elif [ "$CURRENT_HOUR" = "22" ] || [ "$CURRENT_HOUR" = "23" ]; then
            echo "mode=grok_daily" >> $GITHUB_OUTPUT
            echo "skip_trading_check=true" >> $GITHUB_OUTPUT
            echo "skip_grok=false" >> $GITHUB_OUTPUT
            echo "📊 GROK Daily Mode (fallback hour: $CURRENT_HOUR)"
          elif [ "$CURRENT_HOUR" = "07" ] || [ "$CURRENT_HOUR" = "08" ]; then
            echo "mode=cme_update" >> $GITHUB_OUTPUT
            echo "skip_trading_check=true" >> $GITHUB_OUTPUT
            echo "skip_grok=cme" >> $GITHUB_OUTPUT
            echo "🌅 CME Update Mode (fallback hour: $CURRENT_HOUR)"
          else
            echo "mode=stock_data" >> $GITHUB_OUTPUT
            echo "skip_trading_check=false" >> $GITHUB_OUTPUT
            echo "skip_grok=true" >> $GITHUB_OUTPUT
            echo "💹 Stock Data Mode (16:45 JST) - Grok selection skipped"
          fi

      - name: Publish same-day earnings events (22:15 only)
        if: steps.exec_mode.outputs.mode == 'grok_daily' || steps.exec_mode.outputs.mode == 'grok_forced'
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: |
          set -euo pipefail
          AS_OF_DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          echo "Publishing same-day earnings events for $AS_OF_DATE"
          python3 scripts/pipeline/manage_jquants_earnings_events.py close \
            --as-of-date "$AS_OF_DATE"

      - name: Check trading day window
        id: check_trading
        if: ${{ github.event.inputs.skip_trading_day_check != 'true' && steps.exec_mode.outputs.skip_trading_check != 'true' }}
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: |
          echo "🔍 Checking if within trading day execution window..."
          python scripts/check_trading_day.py
          EXIT_CODE=$?

          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ Within execution window (16:45-02:00 JST on trading day)"
          else
            echo "❌ Outside execution window or non-trading day"
          fi

          exit $EXIT_CODE

      - name: Check next day is trading day (for 22:00 run)
        id: check_next_trading
        if: (steps.exec_mode.outputs.mode == 'grok_daily' || steps.exec_mode.outputs.mode == 'grok_forced') && github.event.inputs.skip_trading_day_check != 'true'
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: |
          echo "🔍 Checking if next day is a trading day..."
          python scripts/check_next_day_trading.py
          EXIT_CODE=$?

          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ Next day is a TRADING day - will execute Grok selection"
          else
            echo "❌ Next day is NOT a trading day - skipping Grok selection"
            echo "::notice::Skipping Grok selection - next day is not a trading day"
          fi

          exit $EXIT_CODE

      - name: Skip if outside trading window
        if: |
          steps.check_updated.outputs.already_updated == 'true'
        run: |
          echo "::notice::Skipping pipeline execution - already updated today"
          exit 0

      - name: Verify S3 backups before Grok selection
        id: verify_backup
        if: success() && steps.exec_mode.outputs.mode == 'grok_daily'
        env:
          S3_BUCKET: ${{ env.S3_BUCKET }}
        run: |
          echo "🔍 Verifying S3 backups before Grok selection..."
          echo "============================================================"

          # verify_grok_backup.py は --date を省略すると
          # 自動的に grok_trending.parquet から日付を読み取る
          python3 scripts/verify_grok_backup.py --bucket "$S3_BUCKET"
          EXIT_CODE=$?

          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ S3 backups verified successfully"
            echo "backup_verified=true" >> $GITHUB_OUTPUT
          else
            echo "❌ S3 backup verification failed"
            echo "⚠️  Aborting Grok selection to prevent data loss"
            exit 1
          fi

      - name: Cleanup grok_trending before selection
        if: success() && steps.exec_mode.outputs.mode == 'grok_daily' && github.event_name != 'workflow_dispatch'
        run: |
          echo "🧹 Cleaning up grok_trending.parquet on S3..."
          echo "============================================================"

          # cleanup_grok_trending.py がS3から読み込み・アップロードするので、無条件に実行
          python3 scripts/cleanup_grok_trending.py
          if [ $? -eq 0 ]; then
            echo "✅ Cleanup completed successfully"
          else
            echo "❌ Cleanup failed"
            exit 1
          fi

      - name: Reconcile prior earnings events (16:45 only)
        if: |
          success() && (
            steps.exec_mode.outputs.mode == 'stock_data' ||
            steps.exec_mode.outputs.mode == 'stock_data_forced'
          )
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: |
          set -euo pipefail
          AS_OF_DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          echo "Reconciling earnings events before $AS_OF_DATE"
          python3 scripts/pipeline/manage_jquants_earnings_events.py reconcile \
            --as-of-date "$AS_OF_DATE" \
            --lookback-days 7

      - name: Publish all-market tick and minute partition (17:00 only)
        if: |
          success() && (
            steps.exec_mode.outputs.mode == 'stock_data' ||
            steps.exec_mode.outputs.mode == 'stock_data_forced'
          )
        run: |
          set -euo pipefail
          TARGET_TRADING_DATE="${{ steps.check_trading.outputs.latest_trading_day }}"
          if [ -z "$TARGET_TRADING_DATE" ]; then
            TARGET_TRADING_DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          fi
          echo "Publishing all-market microstructure for $TARGET_TRADING_DATE"
          python3 scripts/pipeline/manage_all_market_microstructure.py daily \
            --trading-date "$TARGET_TRADING_DATE" \
            --availability-timeout-seconds 300

      - name: Sync verified canonical archive reference (16:45 only)
        if: |
          success() && (
            steps.exec_mode.outputs.mode == 'stock_data' ||
            steps.exec_mode.outputs.mode == 'stock_data_forced'
          )
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          import pandas as pd

          from common_cfg.s3cfg import load_s3_config
          from scripts.lib.protected_archive_s3 import download_verified_archive

          destination = Path("data/parquet/backtest/grok_trending_archive.parquet")
          if destination.exists():
              raise RuntimeError(
                  "Protected canonical archive unexpectedly exists before verified S3 sync"
              )
          state = download_verified_archive(load_s3_config(), destination)
          frame = pd.read_parquet(destination, columns=["backtest_date", "ticker"])
          dates = pd.to_datetime(frame["backtest_date"], errors="raise")
          print(
              "[OK] Synced read-only canonical reference: "
              f"rows={len(frame):,}, dates={dates.dt.date.nunique():,}, "
              f"range={dates.min().date()}..{dates.max().date()}, "
              f"sha256={state['sha256']}, version_id={state['version_id']}"
          )
          PY

      - name: Run Data Pipeline
        id: pipeline
        if: |
          success() &&
          steps.exec_mode.outputs.mode != 'cme_update' && (
            steps.exec_mode.outputs.mode == 'stock_data' ||
            steps.exec_mode.outputs.mode == 'stock_data_forced' ||
            steps.check_next_trading.conclusion == 'success' ||
            steps.check_next_trading.conclusion == 'skipped'
          )
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          FORCE_META_UPDATE: ${{ steps.check_trading.outputs.force_meta_update }}
          SKIP_GROK_GENERATION: ${{ steps.exec_mode.outputs.skip_grok }}
          PROMPT_VERSION: v1_2_increased_selection
          ALLOW_GROK_API: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          # Create .env.xai for Grok API
          echo "XAI_API_KEY=$XAI_API_KEY" > .env.xai

          echo "============================================================"
          echo "Data Pipeline Execution (GitHub Actions)"
          echo "Started at: $(TZ=Asia/Tokyo date +"%Y-%m-%d %H:%M:%S JST")"
          echo "============================================================"
          echo ""
          echo "Environment variables:"
          echo "  S3_BUCKET=${{ env.S3_BUCKET }}"
          echo "  PARQUET_PREFIX=${{ env.S3_PREFIX }}"
          echo "  AWS_REGION=${{ env.AWS_REGION }}"
          echo "  FORCE_META_UPDATE=$FORCE_META_UPDATE"
          echo "  SKIP_GROK_GENERATION=$SKIP_GROK_GENERATION"
          echo "  LATEST_TRADING_DAY=${{ steps.check_trading.outputs.latest_trading_day }}"
          echo ""

          # Force update flag for meta_jquants (manual trigger override)
          if [ "${{ github.event.inputs.force_meta_jquants }}" = "true" ]; then
            export FORCE_META_UPDATE=true
            echo "⚠️ Manual force update enabled for meta_jquants.parquet"
          fi

          # 取引制限データをダウンロード（22:00 Grok選定用）
          echo "📥 Downloading trading restriction data for Grok selection..."
          mkdir -p data/parquet

          # 1. margin_code_master.parquet（S3から）
          if ! aws s3 cp "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}margin_code_master.parquet" "data/parquet/margin_code_master.parquet" --only-show-errors; then
            echo "❌ ERROR: Failed to download margin_code_master.parquet from S3"
            exit 1
          fi
          echo "✅ margin_code_master.parquet downloaded from S3"

          # 2. calendar.parquet（S3から、年1回生成済み）
          if ! aws s3 cp "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}calendar.parquet" "data/parquet/calendar.parquet" --only-show-errors; then
            echo "❌ ERROR: Failed to download calendar.parquet from S3"
            exit 1
          fi
          echo "✅ calendar.parquet downloaded from S3"

          # 3. prices_topix500_oc.parquet（差分更新のベース）
          if aws s3 cp "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}prices_topix500_oc.parquet" "data/parquet/prices_topix500_oc.parquet" --only-show-errors 2>/dev/null; then
            echo "✅ prices_topix500_oc.parquet downloaded from S3"
          else
            echo "⚠️ prices_topix500_oc.parquet not found on S3 (will fetch from scratch)"
          fi

          # 4. etf_1306_prices.parquet（差分更新のベース）
          if aws s3 cp "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}etf_1306_prices.parquet" "data/parquet/etf_1306_prices.parquet" --only-show-errors 2>/dev/null; then
            echo "✅ etf_1306_prices.parquet downloaded from S3"
          else
            echo "⚠️ etf_1306_prices.parquet not found on S3 (will fetch from scratch)"
          fi

          # 5. granville/prices_topix.parquet（グランビル・ペア用TOPIX価格）
          mkdir -p data/parquet/granville
          if aws s3 cp "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}granville/prices_topix.parquet" "data/parquet/granville/prices_topix.parquet" --only-show-errors 2>/dev/null; then
            echo "✅ granville/prices_topix.parquet downloaded from S3"
          else
            echo "⚠️ granville/prices_topix.parquet not found on S3"
          fi

          # 6. index_prices_max_1d.parquet（グランビルN225レジーム判定用）
          if aws s3 cp "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}index_prices_max_1d.parquet" "data/parquet/index_prices_max_1d.parquet" --only-show-errors 2>/dev/null; then
            echo "✅ index_prices_max_1d.parquet downloaded from S3"
          else
            echo "⚠️ index_prices_max_1d.parquet not found on S3"
          fi

          # 7. futures_prices_max_1d.parquet（SQ-4/SQ+1/グランビルCMEギャップ用）
          if aws s3 cp "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}futures_prices_max_1d.parquet" "data/parquet/futures_prices_max_1d.parquet" --only-show-errors 2>/dev/null; then
            echo "✅ futures_prices_max_1d.parquet downloaded from S3"
          else
            echo "⚠️ futures_prices_max_1d.parquet not found on S3"
          fi

          # 8. nikkei_vi_latest.json（22:00モードのみ: 16:45で保存済みのVI値を取得）
          # 16:45モードではupdate_granville_prices.pyが生成するのでダウンロード不要
          # （VI取得失敗時に前日JSONを再アップロードする問題を回避）
          if [ "$SKIP_GROK_GENERATION" = "false" ]; then
            mkdir -p data/analysis
            if aws s3 cp "s3://${{ env.S3_BUCKET }}/analysis/nikkei_vi_latest.json" "data/analysis/nikkei_vi_latest.json" --only-show-errors 2>/dev/null; then
              echo "✅ nikkei_vi_latest.json downloaded from S3"
            else
              echo "⚠️ nikkei_vi_latest.json not found on S3"
            fi
          fi

          # 旧parserとの互換用。現行の定期実行では日証金データを判定に使用しない。
          printf '\n\n\n\n銘柄コード,銘柄名,実施措置,実施内容,通知日・実施日\n' > data/parquet/jsf_seigenichiran.csv
          echo "✅ JSF compatibility file created (restrictions not used)"

          # Run the NEW pipeline (scalping skip + Grok)
          # Old pipeline (with scalping): python scripts/run_pipeline.py
          python -u scripts/run_pipeline_scalping_skip_add_grok.py
          EXIT_CODE=$?

          echo ""
          echo "============================================================"
          echo "Pipeline completed with exit code: $EXIT_CODE"
          echo "============================================================"

          exit $EXIT_CODE

      - name: Refresh AWS credentials after data pipeline
        if: success() && steps.exec_mode.outputs.mode != 'cme_update'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish Grok J-Quants master (16:45 only)
        if: success() && steps.exec_mode.outputs.skip_grok == 'true'
        run: |
          set -euo pipefail
          echo "============================================================"
          echo "Publishing Grok J-Quants master (16:45 only)"
          echo "============================================================"

          ARCHIVE_FILE="data/parquet/backtest/grok_trending_archive.parquet"
          mkdir -p data/parquet/backtest data/parquet/jquants data/jquants_csv/grok_archive_minute data/jquants_csv/grok_daily

          if [ ! -f "$ARCHIVE_FILE" ]; then
            echo "📥 Downloading latest archive from S3..."
            aws s3 cp \
              "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}backtest/grok_trending_archive.parquet" \
              "$ARCHIVE_FILE" \
              --only-show-errors
          fi
          if [ ! -f "$ARCHIVE_FILE" ]; then
            echo "❌ ERROR: archive file not found after pipeline and S3 fallback"
            exit 1
          fi

          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          import pandas as pd

          p = Path("data/parquet/backtest/grok_trending_archive.parquet")
          df = pd.read_parquet(p, columns=["backtest_date", "ticker"])
          d = pd.to_datetime(df["backtest_date"], errors="coerce")
          h = hashlib.sha256(p.read_bytes()).hexdigest()
          print(f"archive rows={len(df):,} dates={d.dt.date.nunique():,} range={d.min().date()}..{d.max().date()} sha256={h}")
          PY

          echo "📥 Downloading existing J-Quants caches from S3..."
          if aws s3 cp \
            "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}jquants/grok_archive_minute.parquet" \
            data/parquet/jquants/grok_archive_minute.parquet \
            --only-show-errors 2>/dev/null; then
            echo "✅ Existing archive minute parquet downloaded"
          else
            echo "ℹ️  No existing archive minute parquet on S3"
          fi

          if aws s3 cp \
            "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}jquants/grok_jquants_daily.parquet" \
            data/parquet/jquants/grok_jquants_daily.parquet \
            --only-show-errors 2>/dev/null; then
            echo "✅ Existing J-Quants daily parquet downloaded"
          else
            echo "ℹ️  No existing J-Quants daily parquet on S3"
          fi

          echo "📊 Fetching latest archive-day minute bars..."
          python3 scripts/data/fetch_grok_archive_minute_jquants.py \
            --archive-path "$ARCHIVE_FILE" \
            --output data/parquet/jquants/grok_archive_minute.parquet \
            --raw-dir data/jquants_csv/grok_archive_minute \
            --requests-per-minute 30 \
            --checkpoint-every 20

          echo "📊 Fetching latest archive-day daily fields..."
          python3 scripts/data/fetch_grok_archive_daily_jquants.py \
            --archive-path "$ARCHIVE_FILE" \
            --calendar-path data/parquet/calendar.parquet \
            --output data/parquet/jquants/grok_jquants_daily.parquet \
            --raw-dir data/jquants_csv/grok_daily \
            --all-archive \
            --requests-per-minute 30 \
            --quiet \
            --progress-every 5

          echo "📊 Building J-Quants based Grok master files..."
          python3 scripts/analysis/build_grok_master_price_alignment.py \
            --archive-path "$ARCHIVE_FILE" \
            --minute-path data/parquet/jquants/grok_archive_minute.parquet
          python3 scripts/analysis/build_grok_master_jquants_segments.py \
            --archive-path "$ARCHIVE_FILE" \
            --minute-path data/analysis/grok_intraday_jquants/grok_master_minute_jquants_basis.parquet \
            --daily-path data/parquet/jquants/grok_jquants_daily.parquet \
            --calendar-path data/parquet/calendar.parquet \
            --output-path data/parquet/backtest/grok_master_jquants_segments.parquet

          echo "🔎 Validating J-Quants minute cache and Grok master..."
          MASTER_VALIDATION_JSON="data/parquet/backtest/grok_master_jquants_segments.validation.json"
          set +e
          python3 scripts/analysis/validate_grok_jquants_outputs.py \
            --archive-path "$ARCHIVE_FILE" \
            --minute-path data/parquet/jquants/grok_archive_minute.parquet \
            --daily-path data/parquet/jquants/grok_jquants_daily.parquet \
            --calendar-path data/parquet/calendar.parquet \
            --master-path data/parquet/backtest/grok_master_jquants_segments.parquet \
            --output-json "$MASTER_VALIDATION_JSON"
          MASTER_VALIDATION_EXIT=$?
          set -e

          if [ -f "$MASTER_VALIDATION_JSON" ]; then
            echo "### Grok J-Quants master validation" >> "$GITHUB_STEP_SUMMARY"
            python3 -c 'import json; from pathlib import Path; d = json.loads(Path("data/parquet/backtest/grok_master_jquants_segments.validation.json").read_text(encoding="utf-8")); print("- status: `{}`".format(d.get("status"))); print("- archive rows: `{}`".format(d.get("archive", {}).get("rows"))); print("- minute coverage: `{}/{}`".format(d.get("minute", {}).get("keys_in_archive"), d.get("archive", {}).get("keys"))); print("- master jq_buy_price non-null: `{}`".format(d.get("master", {}).get("jq_buy_price_non_null"))); print("- master jq_seg_1530 non-null: `{}`".format(d.get("master", {}).get("jq_seg_1530_non_null"))); [print("- failure: `{}`".format(failure)) for failure in d.get("failures", [])]; [print("- warning: `{}`".format(warning)) for warning in d.get("warnings", [])]' >> "$GITHUB_STEP_SUMMARY"
            aws s3 cp \
              "$MASTER_VALIDATION_JSON" \
              "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}backtest/grok_master_jquants_segments.validation.json" \
              --only-show-errors
          fi

          if [ "$MASTER_VALIDATION_EXIT" -ne 0 ]; then
            echo "❌ J-Quants Grok master validation failed. Existing S3 master/cache were preserved."
            exit "$MASTER_VALIDATION_EXIT"
          fi

          echo "📤 Uploading validated J-Quants parquet and master files..."
          aws s3 cp \
            data/parquet/jquants/grok_archive_minute.parquet \
            "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}jquants/grok_archive_minute.parquet" \
            --only-show-errors
          if [ -f "data/parquet/jquants/grok_jquants_daily.parquet" ]; then
            aws s3 cp \
              data/parquet/jquants/grok_jquants_daily.parquet \
              "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}jquants/grok_jquants_daily.parquet" \
              --only-show-errors
          fi
          aws s3 cp \
            data/parquet/backtest/grok_master_jquants_segments.parquet \
            "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}backtest/grok_master_jquants_segments.parquet" \
            --only-show-errors
          echo "📋 Finalizing manifest after J-Quants derived artifacts..."
          python3 scripts/pipeline/update_manifest.py --manifest-only
          echo "✅ J-Quants Grok master parquet uploaded"
          echo "============================================================"

      - name: Generate trading recommendation (22:00 only)
        if: success() && steps.exec_mode.outputs.skip_grok == 'false'
        env:
          INPUT_GROK_TRENDING: data/parquet/grok_trending.parquet
          OUTPUT_RECOMMENDATION_JSON: data/parquet/backtest/trading_recommendation.json
        run: |
          echo "============================================================"
          echo "Generating trading_recommendation.json (22:00 Grok selection)"
          echo "============================================================"

          mkdir -p data/parquet/backtest

          # 必須ファイルの存在確認
          echo "🔍 Checking required files..."
          if [ ! -f "data/parquet/prices_max_1d.parquet" ]; then
            echo "❌ ERROR: prices_max_1d.parquet not found (required for v2.1)"
            echo "This file should have been generated by the pipeline step"
            exit 1
          fi
          echo "✅ prices_max_1d.parquet exists"

          # Run Data Pipelineが生成した未公開のローカル成果物を使用する。
          # 公式D-1 MktCapとMLが揃うまではS3の確定版を上書きしない。
          echo "🔍 Checking unpublished local grok_trending.parquet..."
          if [ ! -f "data/parquet/grok_trending.parquet" ]; then
            echo "❌ ERROR: Local grok_trending.parquet was not generated"
            exit 1
          fi
          echo "✅ Local unpublished grok_trending.parquet exists"

          # 推薦日Dに対し、直前営業日D-1の公式J-Quants MktCapを使用する。
          # ETF/ETNのMktCap=nullは有効だが、D-1ソース行欠損や時点ずれは停止する。
          echo "📊 Adding official D-1 J-Quants market_cap to grok_trending.parquet..."
          if ! python3 scripts/pipeline/add_market_cap_to_grok_trending.py; then
            echo "❌ ERROR: Failed to attach validated official D-1 market_cap"
            exit 1
          fi
          echo "✅ Added validated official D-1 market_cap column"
          # ML予測（prob_up）カラムを追加
          echo "🤖 Adding ML prediction (prob_up) to grok_trending.parquet..."

          # 必要なファイルをS3からダウンロード
          echo "📥 Downloading files for ML prediction..."

          # grok_prices_max_1d.parquet
          if ! aws s3 cp \
            "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}grok_prices_max_1d.parquet" \
            data/parquet/grok_prices_max_1d.parquet \
            --only-show-errors; then
            echo "⚠️ Warning: grok_prices_max_1d.parquet not found in S3"
          fi

          # 公式J-Quants時価総額へ置換済みの不変正本をML参照用に取得する。
          aws s3 cp \
            "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}backtest/grok_trending_archive.parquet" \
            data/parquet/backtest/grok_trending_archive.parquet \
            --only-show-errors

          # 新規銘柄の価格データを取得（grok_trendingの銘柄がgrok_prices_max_1dにない場合）
          echo "📊 Updating grok_prices_max_1d.parquet with new tickers..."
          if ! python3 scripts/pipeline/generate_grok_prices_max_1d.py; then
            echo "❌ ERROR: Current Grok price history coverage is incomplete"
            exit 1
          fi

          # 更新されたgrok_prices_max_1d.parquetをS3にアップロード
          if [ -f "data/parquet/grok_prices_max_1d.parquet" ]; then
            aws s3 cp \
              data/parquet/grok_prices_max_1d.parquet \
              "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}grok_prices_max_1d.parquet" \
              --only-show-errors
            echo "✅ Updated grok_prices_max_1d.parquet on S3"
          fi

          # MLモデルファイル
          mkdir -p models
          if ! aws s3 cp \
            "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}ml/grok_lgbm_model.pkl" \
            models/grok_lgbm_model.pkl \
            --only-show-errors; then
            echo "❌ ERROR: ML model not found in S3"
            exit 1
          fi
          if ! aws s3 cp \
            "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}ml/grok_lgbm_meta.json" \
            models/grok_lgbm_meta.json \
            --only-show-errors; then
            echo "❌ ERROR: ML model metadata not found in S3"
            exit 1
          fi

          # 市場データ（index, futures, currency）
          aws s3 cp \
            "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}index_prices_max_1d.parquet" \
            data/parquet/index_prices_max_1d.parquet \
            --only-show-errors || echo "⚠️ index_prices not found"
          aws s3 cp \
            "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}futures_prices_max_1d.parquet" \
            data/parquet/futures_prices_max_1d.parquet \
            --only-show-errors || echo "⚠️ futures_prices not found"
          aws s3 cp \
            "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}currency_prices_max_1d.parquet" \
            data/parquet/currency_prices_max_1d.parquet \
            --only-show-errors || echo "⚠️ currency_prices not found"

          # 既存26特徴量モデルでML予測を実行する。
          if ! python3 scripts/pipeline/add_ml_prediction_to_grok_trending.py; then
            echo "❌ ERROR: ML prediction failed"
            exit 1
          fi
          echo "✅ Added prob_up column with the 26-feature model"
          # trading_recommendation.json を生成（v2.1ロジック - 2階建てアーキテクチャ）
          echo "📊 Generating trading_recommendation.json (v2.1 - 2階建てアーキテクチャ)..."
          python3 scripts/pipeline/generate_trading_recommendation_v2_1.py

          if [ $? -eq 0 ] && [ -f "data/parquet/backtest/trading_recommendation.json" ]; then
            echo "✅ Generated trading_recommendation.json"

            echo "✅ Recommendation kept local until Grok finalization succeeds"
          else
            echo "❌ ERROR: Failed to generate trading_recommendation.json"
            exit 1
          fi

          echo "============================================================"

      - name: Publish finalized Grok and manifest (22:15 only)
        if: success() && steps.exec_mode.outputs.skip_grok == 'false'
        run: |
          set -euo pipefail
          echo "============================================================"
          echo "Publishing finalized Grok dataset and manifest"
          echo "============================================================"

          # market_cap付与とML予測が完了した同一ファイルを公開し、その後manifestを更新する。
          aws s3 cp \
            data/parquet/grok_trending.parquet \
            "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}grok_trending.parquet" \
            --region ${{ env.AWS_REGION }} \
            --only-show-errors
          python3 scripts/pipeline/update_manifest.py --manifest-only

          if [ ! -f "data/parquet/backtest/trading_recommendation.json" ]; then
            echo "❌ ERROR: finalized recommendation is missing"
            exit 1
          fi
          aws s3 cp \
            data/parquet/backtest/trading_recommendation.json \
            "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}backtest/trading_recommendation.json" \
            --region ${{ env.AWS_REGION }} \
            --only-show-errors
          echo "✅ Final Grok, manifest, and recommendation published"
          echo "============================================================"

      - name: Update day trade list (22:15 only)
        if: success() && steps.exec_mode.outputs.skip_grok == 'false'
        env:
          S3_BUCKET: ${{ env.S3_BUCKET }}
          S3_PREFIX: ${{ env.S3_PREFIX }}
        run: |
          echo "============================================================"
          echo "Updating grok_day_trade_list.parquet (22:15 Grok selection)"
          echo "============================================================"

          # grok_trending.parquet は前のステップでダウンロード済み
          if [ ! -f "data/parquet/grok_trending.parquet" ]; then
            echo "❌ ERROR: grok_trending.parquet not found"
            exit 1
          fi

          # 銘柄追加スクリプトを実行
          # - S3から grok_day_trade_list.parquet をダウンロード
          # - 新規銘柄のみ追加（上書き厳禁）
          # - S3にアップロード
          python3 scripts/pipeline/update_day_trade_list.py

          if [ $? -eq 0 ]; then
            echo "✅ Day trade list updated successfully"
          else
            echo "⚠️ Day trade list update failed (non-critical)"
          fi

          echo "============================================================"

      - name: Fetch Grok pretrade minute context (22:15 only)
        if: success() && steps.exec_mode.outputs.skip_grok == 'false'
        run: |
          echo "============================================================"
          echo "Fetching Grok pretrade minute context (22:15 only)"
          echo "============================================================"

          if [ ! -f "data/parquet/grok_trending.parquet" ]; then
            echo "❌ ERROR: grok_trending.parquet not found"
            exit 1
          fi
          if [ ! -f "data/parquet/grok_prices_max_1d.parquet" ]; then
            echo "❌ ERROR: grok_prices_max_1d.parquet not found"
            exit 1
          fi

          mkdir -p data/parquet/jquants data/jquants_csv/grok_pretrade_minute_context

          if aws s3 cp \
            "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}jquants/grok_pretrade_minute_context.parquet" \
            data/parquet/jquants/grok_pretrade_minute_context.parquet \
            --only-show-errors 2>/dev/null; then
            echo "✅ Existing pretrade minute context downloaded"
          else
            echo "ℹ️  No existing pretrade minute context on S3"
          fi

          if aws s3 cp \
            "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}jquants/grok_pretrade_minute_context_targets.parquet" \
            data/parquet/jquants/grok_pretrade_minute_context_targets.parquet \
            --only-show-errors 2>/dev/null; then
            echo "✅ Existing pretrade minute context targets downloaded"
          else
            echo "ℹ️  No existing pretrade minute context targets on S3"
          fi

          python3 scripts/data/fetch_grok_archive_minute_context_jquants.py \
            --source-kind trending \
            --archive-path data/parquet/grok_trending.parquet \
            --calendar-path data/parquet/grok_prices_max_1d.parquet \
            --output data/parquet/jquants/grok_pretrade_minute_context.parquet \
            --target-map-output data/parquet/jquants/grok_pretrade_minute_context_targets.parquet \
            --raw-dir data/jquants_csv/grok_pretrade_minute_context \
            --lags 1 2 3 4 5 \
            --requests-per-minute 30 \
            --quiet \
            --progress-every 20

          if [ -f "data/parquet/jquants/grok_pretrade_minute_context.parquet" ]; then
            aws s3 cp \
              data/parquet/jquants/grok_pretrade_minute_context.parquet \
              "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}jquants/grok_pretrade_minute_context.parquet" \
              --only-show-errors
          else
            echo "⚠️  pretrade minute context parquet was not created"
          fi
          if [ -f "data/parquet/jquants/grok_pretrade_minute_context_targets.parquet" ]; then
            aws s3 cp \
              data/parquet/jquants/grok_pretrade_minute_context_targets.parquet \
              "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}jquants/grok_pretrade_minute_context_targets.parquet" \
              --only-show-errors
          else
            echo "⚠️  pretrade minute context target map was not created"
          fi

          echo "✅ Grok pretrade minute context uploaded to S3"
          echo "============================================================"

      - name: Run backtest and archive
        # The active 16:45 pipeline already runs the guarded archive update.
        # Keep this legacy block disabled to avoid processing the same day twice.
        if: ${{ false }}
        run: |
          echo "============================================================"
          echo "Running backtest and archiving results (16:45 only)"
          echo "============================================================"

          # S3から既存のアーカイブファイルをダウンロード
          mkdir -p data/parquet/backtest
          ARCHIVE_FILE="grok_trending_archive.parquet"
          S3_ARCHIVE_PATH="s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}backtest/$ARCHIVE_FILE"

          if aws s3 ls "$S3_ARCHIVE_PATH" > /dev/null 2>&1; then
            echo "📥 Downloading existing archive from S3..."
            aws s3 cp "$S3_ARCHIVE_PATH" "data/parquet/backtest/$ARCHIVE_FILE" --only-show-errors
            EXISTING_RECORDS=$(python -c "import pandas as pd; df=pd.read_parquet('data/parquet/backtest/$ARCHIVE_FILE'); print(len(df))")
            EXISTING_DATES=$(python -c "import pandas as pd; df=pd.read_parquet('data/parquet/backtest/$ARCHIVE_FILE'); print(df['backtest_date'].nunique())")
            echo "✅ Downloaded archive: $EXISTING_RECORDS records across $EXISTING_DATES days"
          else
            echo "ℹ️  No existing archive found in S3, will create new one"
          fi

          # 取引制限データをダウンロード（margin_code + 日証金制限）- 必須ファイル
          echo "📥 Downloading trading restriction data (required)..."

          # 1. margin_code_master.parquet（S3から）
          if ! aws s3 cp "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}margin_code_master.parquet" "data/parquet/margin_code_master.parquet" --only-show-errors; then
            echo "❌ ERROR: Failed to download margin_code_master.parquet from S3"
            exit 1
          fi
          echo "✅ margin_code_master.parquet downloaded from S3"

          # 2. calendar.parquet（S3から、年1回生成済み）
          if ! aws s3 cp "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}calendar.parquet" "data/parquet/calendar.parquet" --only-show-errors; then
            echo "❌ ERROR: Failed to download calendar.parquet from S3"
            exit 1
          fi
          echo "✅ calendar.parquet downloaded from S3"

          # 3. prices_topix500_oc.parquet（差分更新のベース）
          if aws s3 cp "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}prices_topix500_oc.parquet" "data/parquet/prices_topix500_oc.parquet" --only-show-errors 2>/dev/null; then
            echo "✅ prices_topix500_oc.parquet downloaded from S3"
          else
            echo "⚠️ prices_topix500_oc.parquet not found on S3 (will fetch from scratch)"
          fi

          # 4. etf_1306_prices.parquet（差分更新のベース）
          if aws s3 cp "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}etf_1306_prices.parquet" "data/parquet/etf_1306_prices.parquet" --only-show-errors 2>/dev/null; then
            echo "✅ etf_1306_prices.parquet downloaded from S3"
          else
            echo "⚠️ etf_1306_prices.parquet not found on S3 (will fetch from scratch)"
          fi

          # 5. granville/prices_topix.parquet（グランビル・ペア用TOPIX価格）
          mkdir -p data/parquet/granville
          if aws s3 cp "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}granville/prices_topix.parquet" "data/parquet/granville/prices_topix.parquet" --only-show-errors 2>/dev/null; then
            echo "✅ granville/prices_topix.parquet downloaded from S3"
          else
            echo "⚠️ granville/prices_topix.parquet not found on S3"
          fi

          # 6. index_prices_max_1d.parquet（グランビルN225レジーム判定用）
          if aws s3 cp "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}index_prices_max_1d.parquet" "data/parquet/index_prices_max_1d.parquet" --only-show-errors 2>/dev/null; then
            echo "✅ index_prices_max_1d.parquet downloaded from S3"
          else
            echo "⚠️ index_prices_max_1d.parquet not found on S3"
          fi

          # 7. futures_prices_max_1d.parquet（SQ-4/SQ+1/グランビルCMEギャップ用）
          if aws s3 cp "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}futures_prices_max_1d.parquet" "data/parquet/futures_prices_max_1d.parquet" --only-show-errors 2>/dev/null; then
            echo "✅ futures_prices_max_1d.parquet downloaded from S3"
          else
            echo "⚠️ futures_prices_max_1d.parquet not found on S3"
          fi

          # 旧parserとの互換用。現行の定期実行では日証金データを判定に使用しない。
          printf '\n\n\n\n銘柄コード,銘柄名,実施措置,実施内容,通知日・実施日\n' > data/parquet/jsf_seigenichiran.csv
          echo "✅ JSF compatibility file created (restrictions not used)"

          # バックテストを実行（S3のGROK選定結果を使用）
          echo "Running backtest from S3 grok_trending.parquet..."
          python scripts/pipeline/save_backtest_to_archive.py

          if [ $? -eq 0 ]; then
            echo "✅ Backtest completed and archived"
          else
            echo "⚠️ Backtest failed (non-critical)"
          fi

          # d1-d5保持リターンをアーカイブに追記
          echo "Updating archive with d1-d5 holding returns..."
          python scripts/pipeline/update_archive_holding_returns.py

          if [ -f "data/parquet/backtest/$ARCHIVE_FILE" ]; then
            echo "📥 Preparing J-Quants minute/daily caches..."
            mkdir -p data/parquet/jquants data/jquants_csv/grok_archive_minute data/jquants_csv/grok_daily

            if aws s3 cp \
              "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}jquants/grok_archive_minute.parquet" \
              data/parquet/jquants/grok_archive_minute.parquet \
              --only-show-errors 2>/dev/null; then
              echo "✅ Existing archive minute parquet downloaded"
            else
              echo "ℹ️  No existing archive minute parquet on S3"
            fi

            if aws s3 cp \
              "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}jquants/grok_jquants_daily.parquet" \
              data/parquet/jquants/grok_jquants_daily.parquet \
              --only-show-errors 2>/dev/null; then
              echo "✅ Existing J-Quants daily parquet downloaded"
            else
              echo "ℹ️  No existing J-Quants daily parquet on S3"
            fi

            echo "📊 Fetching latest archive-day minute bars..."
            python3 scripts/data/fetch_grok_archive_minute_jquants.py \
              --archive-path data/parquet/backtest/$ARCHIVE_FILE \
              --output data/parquet/jquants/grok_archive_minute.parquet \
              --raw-dir data/jquants_csv/grok_archive_minute \
              --requests-per-minute 30 \
              --checkpoint-every 20

            echo "📊 Fetching archive daily fields from J-Quants..."
            python3 scripts/data/fetch_grok_archive_daily_jquants.py \
              --archive-path data/parquet/backtest/$ARCHIVE_FILE \
              --output data/parquet/jquants/grok_jquants_daily.parquet \
              --raw-dir data/jquants_csv/grok_daily \
              --requests-per-minute 30 \
              --quiet \
              --progress-every 5

            echo "📊 Building J-Quants based Grok master files..."
            python3 scripts/analysis/build_grok_master_price_alignment.py \
              --minute-path data/parquet/jquants/grok_archive_minute.parquet
            python3 scripts/analysis/build_grok_master_jquants_segments.py

            echo "🔎 Validating J-Quants minute cache and Grok master..."
            MASTER_VALIDATION_JSON="data/parquet/backtest/grok_master_jquants_segments.validation.json"
            set +e
            python3 scripts/analysis/validate_grok_jquants_outputs.py \
              --archive-path data/parquet/backtest/$ARCHIVE_FILE \
              --minute-path data/parquet/jquants/grok_archive_minute.parquet \
              --master-path data/parquet/backtest/grok_master_jquants_segments.parquet \
              --output-json "$MASTER_VALIDATION_JSON"
            MASTER_VALIDATION_EXIT=$?
            set -e

            if [ -f "$MASTER_VALIDATION_JSON" ]; then
              echo "### Grok J-Quants master validation" >> "$GITHUB_STEP_SUMMARY"
              echo '```json' >> "$GITHUB_STEP_SUMMARY"
              cat "$MASTER_VALIDATION_JSON" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi

            echo "📤 Uploading J-Quants parquet and master files..."
            if [ -f "$MASTER_VALIDATION_JSON" ]; then
              aws s3 cp \
                "$MASTER_VALIDATION_JSON" \
                "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}backtest/grok_master_jquants_segments.validation.json" \
                --only-show-errors
            fi
            if [ "$MASTER_VALIDATION_EXIT" -eq 0 ]; then
              if [ -f "data/parquet/jquants/grok_archive_minute.parquet" ]; then
                aws s3 cp \
                  data/parquet/jquants/grok_archive_minute.parquet \
                  "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}jquants/grok_archive_minute.parquet" \
                  --only-show-errors
              else
                echo "⚠️  archive minute parquet was not created"
              fi
            else
              echo "::error::Grok J-Quants master validation failed; keeping existing S3 minute cache and master"
            fi
            if [ -f "data/parquet/jquants/grok_jquants_daily.parquet" ]; then
              aws s3 cp \
                data/parquet/jquants/grok_jquants_daily.parquet \
                "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}jquants/grok_jquants_daily.parquet" \
                --only-show-errors
            else
              echo "⚠️  J-Quants daily parquet was not created"
            fi
            if [ "$MASTER_VALIDATION_EXIT" -eq 0 ] && [ -f "data/parquet/backtest/grok_master_jquants_segments.parquet" ]; then
              aws s3 cp \
                data/parquet/backtest/grok_master_jquants_segments.parquet \
                "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}backtest/grok_master_jquants_segments.parquet" \
                --only-show-errors
              echo "✅ J-Quants Grok master parquet uploaded"
            elif [ "$MASTER_VALIDATION_EXIT" -ne 0 ]; then
              echo "⚠️  J-Quants Grok master parquet was not uploaded because validation failed"
            else
              echo "⚠️  J-Quants Grok master parquet was not created"
            fi
            if [ "$MASTER_VALIDATION_EXIT" -ne 0 ]; then
              echo "❌ J-Quants Grok master validation failed. Existing S3 master/cache were preserved."
              exit "$MASTER_VALIDATION_EXIT"
            fi
            echo "✅ J-Quants parquet and master files uploaded"
          else
            echo "⚠️  Archive file not found after backtest; skipping J-Quants archive enrichment"
          fi

          echo "============================================================"

      - name: Extract data statistics
        id: stats
        if: success()
        run: |
          # meta_jquants statistics
          META_JQUANTS_COUNT=0
          if [ -f "data/parquet/meta_jquants.parquet" ]; then
            META_JQUANTS_COUNT=$(python -c "import pandas as pd; print(len(pd.read_parquet('data/parquet/meta_jquants.parquet')))")
          fi
          echo "meta_jquants_count=$META_JQUANTS_COUNT" >> $GITHUB_OUTPUT

          # grok_trending statistics (from S3)
          GROK_COUNT=0
          if aws s3 ls "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}grok_trending.parquet" > /dev/null 2>&1; then
            mkdir -p data/parquet
            aws s3 cp "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}grok_trending.parquet" data/parquet/grok_trending.parquet --only-show-errors
            GROK_COUNT=$(python -c "import pandas as pd; print(len(pd.read_parquet('data/parquet/grok_trending.parquet')))")
            rm -f data/parquet/grok_trending.parquet
          fi
          echo "grok_trending_count=$GROK_COUNT" >> $GITHUB_OUTPUT

          # grok_backtest_meta statistics (NEW)
          GROK_BACKTEST_EXISTS=false
          if [ -f "data/parquet/grok_backtest_meta.parquet" ]; then
            GROK_BACKTEST_EXISTS=true
          fi
          echo "grok_backtest_exists=$GROK_BACKTEST_EXISTS" >> $GITHUB_OUTPUT

          # grok_trending_archive statistics (NEW)
          ARCHIVE_TOTAL=0
          ARCHIVE_DATES=0
          if [ -f "data/parquet/backtest/grok_trending_archive.parquet" ]; then
            ARCHIVE_TOTAL=$(python -c "import pandas as pd; print(len(pd.read_parquet('data/parquet/backtest/grok_trending_archive.parquet')))")
            ARCHIVE_DATES=$(python -c "import pandas as pd; df=pd.read_parquet('data/parquet/backtest/grok_trending_archive.parquet'); print(df['backtest_date'].nunique())")
          fi
          echo "archive_total=$ARCHIVE_TOTAL" >> $GITHUB_OUTPUT
          echo "archive_dates=$ARCHIVE_DATES" >> $GITHUB_OUTPUT

          # scalping statistics (kept for compatibility, will be 0)
          ENTRY_COUNT=0
          ACTIVE_COUNT=0
          if [ -f "data/parquet/scalping_entry.parquet" ]; then
            ENTRY_COUNT=$(python -c "import pandas as pd; print(len(pd.read_parquet('data/parquet/scalping_entry.parquet')))")
          fi
          if [ -f "data/parquet/scalping_active.parquet" ]; then
            ACTIVE_COUNT=$(python -c "import pandas as pd; print(len(pd.read_parquet('data/parquet/scalping_active.parquet')))")
          fi
          echo "scalping_entry_count=$ENTRY_COUNT" >> $GITHUB_OUTPUT
          echo "scalping_active_count=$ACTIVE_COUNT" >> $GITHUB_OUTPUT

          # all_stocks statistics
          ALL_STOCKS_COUNT=0
          if [ -f "data/parquet/all_stocks.parquet" ]; then
            ALL_STOCKS_COUNT=$(python -c "import pandas as pd; print(len(pd.read_parquet('data/parquet/all_stocks.parquet')))")
          fi
          echo "all_stocks_count=$ALL_STOCKS_COUNT" >> $GITHUB_OUTPUT

          # prices statistics
          LATEST_DATE="N/A"
          if [ -f "data/parquet/prices_max_1d.parquet" ]; then
            LATEST_DATE=$(python -c "import pandas as pd; df=pd.read_parquet('data/parquet/prices_max_1d.parquet'); print(df['date'].max() if not df.empty else 'N/A')")
          fi
          echo "latest_price_date=$LATEST_DATE" >> $GITHUB_OUTPUT

          echo "📊 Statistics extracted:"
          echo "  - meta_jquants: $META_JQUANTS_COUNT stocks"
          echo "  - grok_trending: $GROK_COUNT stocks"
          echo "  - grok_archive: $ARCHIVE_TOTAL records across $ARCHIVE_DATES days"
          echo "  - scalping_entry: $ENTRY_COUNT stocks (skipped)"
          echo "  - scalping_active: $ACTIVE_COUNT stocks (skipped)"
          echo "  - all_stocks: $ALL_STOCKS_COUNT stocks"
          echo "  - latest_price_date: $LATEST_DATE"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output-${{ github.run_id }}
          path: |
            data/parquet/*.parquet
            data/parquet/manifest.json
          if-no-files-found: warn
          retention-days: 7

      - name: Send Slack notification (skipped 02:00 JST)
        if: |
          github.event.schedule == '0 17 * * *' &&
          steps.check_updated.outputs.already_updated == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_INCOMING_WEBHOOK_URL }}
        run: |
          TODAY=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          MESSAGE='{
            "text": "ℹ️ Data Pipeline Skipped (Already Updated)",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "ℹ️ *Data Pipeline Skipped*\nData already updated today (`'"${TODAY}"'`). Skipping 02:00 JST run."
                }
              },
              {
                "type": "section",
                "fields": [
                  {"type": "mrkdwn", "text": "*Branch:*\n`${{ github.ref_name }}`"},
                  {"type": "mrkdwn", "text": "*Trigger:*\n`02:00 JST scheduled run`"}
                ]
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": {"type": "plain_text", "text": "View Workflow Run"},
                    "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                ]
              }
            ]
          }'
          curl -X POST -H 'Content-type: application/json' --data "$MESSAGE" "$SLACK_WEBHOOK_URL" || true

      - name: Archive GROK trending for backtest
        id: archive-grok
        if: success() && steps.exec_mode.outputs.skip_grok == 'true'
        run: |
          # save_backtest_to_archive.py が grok_trending_{DATE}.parquet を生成するため、
          # ここでのアーカイブは不要になりました。このステップはスキップします。
          echo "ℹ️  Archiving is handled by save_backtest_to_archive.py"

          if false; then
            # cron判定
            if [ "${{ github.event.schedule }}" = "45 7 * * *" ]; then
              RUN_TIME="16:45"
            elif [ "${{ github.event.schedule }}" = "15 13 * * *" ]; then
              RUN_TIME="22:15"
            else
              RUN_TIME="manual"
            fi

            echo "📦 Archiving GROK trending for backtest ($RUN_TIME run)..."

            # 日付取得（JST基準、YYYYMMDD形式）
            DATE=$(TZ=Asia/Tokyo date +%Y%m%d)
            BACKTEST_FILE="grok_trending_${DATE}.parquet"
            BACKTEST_DIR="data/parquet/backtest"

            echo "[INFO] Run time: $RUN_TIME"
            echo "[INFO] JST Date: $DATE"
            echo "[INFO] Backup file: $BACKTEST_FILE (will overwrite if exists)"

            # バックテストディレクトリ作成
            mkdir -p "$BACKTEST_DIR"

            # コピー
            cp "data/parquet/grok_trending.parquet" "$BACKTEST_DIR/$BACKTEST_FILE"
            echo "✅ Created: $BACKTEST_DIR/$BACKTEST_FILE"

            # S3にアップロード（上書き保存）
            aws s3 cp "$BACKTEST_DIR/$BACKTEST_FILE" \
              "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}backtest/$BACKTEST_FILE" \
              --region ${{ env.AWS_REGION }}
            echo "✅ Uploaded to S3: s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}backtest/$BACKTEST_FILE"

            echo "✅ Backtest archiving completed"
          else
            echo "⚠️  grok_trending.parquet not found, skipping backtest archive"
          fi

      - name: Update Granville prices (TOPIX daily)
        if: success() && steps.exec_mode.outputs.skip_grok == 'true'
        run: |
          echo "============================================================"
          echo "Updating Granville TOPIX prices (16:45 only)"
          echo "============================================================"

          mkdir -p data/parquet/granville

          # S3からprices_topix.parquetをダウンロード
          if aws s3 ls "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}granville/prices_topix.parquet" > /dev/null 2>&1; then
            echo "📥 Downloading prices_topix.parquet from S3..."
            aws s3 cp \
              "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}granville/prices_topix.parquet" \
              "data/parquet/granville/prices_topix.parquet" --only-show-errors
          fi

          python3 scripts/pipeline/update_granville_prices.py

          if [ $? -eq 0 ]; then
            echo "✅ Granville prices updated"
            # 日経VI最新値をS3にアップロード（analysis/直下、parquet/prefix外）
            if [ -f "data/analysis/nikkei_vi_latest.json" ]; then
              aws s3 cp "data/analysis/nikkei_vi_latest.json" \
                "s3://${{ env.S3_BUCKET }}/analysis/nikkei_vi_latest.json" --only-show-errors
              echo "✅ nikkei_vi_latest.json uploaded to S3"
            fi
          else
            echo "⚠️ Granville prices update failed (non-critical)"
          fi
        timeout-minutes: 45

      - name: Upload unified signals to S3
        if: success() && steps.exec_mode.outputs.mode != 'cme_update'
        run: |
          echo "📤 Uploading unified signals.parquet..."
          [ -f "data/parquet/signals.parquet" ] && aws s3 cp "data/parquet/signals.parquet" "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}signals.parquet" --only-show-errors && echo "✅ signals.parquet uploaded"

      - name: Upload Calendar Trades data to S3
        if: success() && steps.exec_mode.outputs.mode != 'cme_update'
        run: |
          echo "📤 Uploading calendar price parquets..."
          for f in etf_1306_prices.parquet prices_topix500_oc.parquet; do
            [ -f "data/parquet/$f" ] && aws s3 cp "data/parquet/$f" "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}$f" --only-show-errors && echo "✅ $f uploaded"
          done
          echo "📤 Uploading calendar trades JSON..."
          for f in quarter_end_effect.json sq4_trades.json sq_plus1_trades.json weekday_edge_trades.json; do
            [ -f "data/analysis/$f" ] && aws s3 cp "data/analysis/$f" "s3://${{ env.S3_BUCKET }}/analysis/$f" --only-show-errors && echo "✅ $f uploaded"
          done

      - name: Generate semicon domestic candidates
        if: success() && steps.exec_mode.outputs.skip_grok == 'true'
        run: |
          echo "============================================================"
          echo "Generating semicon domestic candidates (16:45)"
          echo "============================================================"

          python3 scripts/analysis/semiconductor/backtest_semicon_trend.py || echo "⚠️ Semicon backtest generation failed (non-fatal)"
          python3 scripts/analysis/semiconductor/generate_yf_entry_risk_report.py
          python3 scripts/pipeline/generate_semicon_api_artifacts.py --mode domestic

          aws s3 cp \
            data/analysis/semicon_domestic_candidates.json \
            "s3://${{ env.S3_BUCKET }}/analysis/semicon_domestic_candidates.json" \
            --only-show-errors
          echo "✅ semicon_domestic_candidates.json uploaded to S3"

          if [ -f "scripts/analysis/semiconductor/output/ai_semiconductor_yf_entry_risk_report.html" ]; then
            aws s3 cp \
              scripts/analysis/semiconductor/output/ai_semiconductor_yf_entry_risk_report.html \
              "s3://${{ env.S3_BUCKET }}/analysis/semicon_entry_risk_report.html" \
              --only-show-errors
            echo "✅ semicon_entry_risk_report.html uploaded to S3"
          fi
          if [ -f "scripts/analysis/semiconductor/output/semicon_trend_backtest_report.html" ]; then
            aws s3 cp \
              scripts/analysis/semiconductor/output/semicon_trend_backtest_report.html \
              "s3://${{ env.S3_BUCKET }}/analysis/semicon_trend_backtest_report.html" \
              --only-show-errors
            echo "✅ semicon_trend_backtest_report.html uploaded to S3"
          fi
        timeout-minutes: 45

      - name: Generate strategy weekday matrix
        if: success() && steps.exec_mode.outputs.mode != 'cme_update'
        run: |
          echo "📊 Generating strategy × weekday PF matrix..."
          if [ ! -f "data/parquet/backtest/grok_trending_archive.parquet" ]; then
            echo "⚠️ grok_trending_archive.parquet not found, skipping strategy matrix"
            exit 0
          fi
          mkdir -p data/analysis
          python3 scripts/pipeline/generate_strategy_matrix.py || echo "⚠️ Strategy matrix generation failed (non-fatal)"

          if [ -f "data/analysis/strategy_matrix.json" ]; then
            aws s3 cp \
              data/analysis/strategy_matrix.json \
              "s3://${{ env.S3_BUCKET }}/analysis/strategy_matrix.json" \
              --only-show-errors
            echo "✅ strategy_matrix.json uploaded to S3"
          fi

      # ===== 07:00 CME更新フェーズ =====
      - name: "[CME] Check trading day"
        id: check_trading_cme
        if: steps.exec_mode.outputs.mode == 'cme_update' && github.event.inputs.skip_trading_day_check != 'true'
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: |
          python scripts/check_today_trading.py
        continue-on-error: true

      - name: "[CME] Update CME close and futures prices"
        if: steps.exec_mode.outputs.mode == 'cme_update' && (steps.check_trading_cme.outcome == 'success' || github.event.inputs.skip_trading_day_check == 'true')
        run: |
          echo "🌅 Updating CME close and futures prices..."
          mkdir -p data/parquet

          # S3から既存データをダウンロード
          aws s3 cp "s3://${S3_BUCKET}/${S3_PREFIX}nikkei_vi_max_1d.parquet" "data/parquet/nikkei_vi_max_1d.parquet" --only-show-errors || true
          aws s3 cp "s3://${S3_BUCKET}/${S3_PREFIX}futures_prices_max_1d.parquet" "data/parquet/futures_prices_max_1d.parquet" --only-show-errors || true
          aws s3 cp "s3://${S3_BUCKET}/${S3_PREFIX}index_prices_max_1d.parquet" "data/parquet/index_prices_max_1d.parquet" --only-show-errors || true

          # CME終値確定（/tmp/cme_update.json生成）
          python scripts/pipeline/update_cme_close.py

          # 先物価格を最新に更新してS3にアップロード（APIのregime/triggers用）
          python3 -c "
          import yfinance as yf, pandas as pd, sys
          sys.path.insert(0, '.')
          from common_cfg.paths import PARQUET_DIR

          fp = PARQUET_DIR / 'futures_prices_max_1d.parquet'
          if not fp.exists():
              print('[WARN] futures_prices_max_1d.parquet not found, skipping')
              exit(0)

          df = pd.read_parquet(fp)
          # NKD=Fの最新行を更新
          nkd = yf.download('NKD=F', period='5d', interval='1d', progress=False)
          if isinstance(nkd.columns, pd.MultiIndex):
              nkd.columns = [c[0] for c in nkd.columns]
          if not nkd.empty:
              nkd['ticker'] = 'NKD=F'
              nkd = nkd.reset_index().rename(columns={'Date': 'date'})
              nkd['date'] = pd.to_datetime(nkd['date']).dt.tz_localize(None)
              df['date'] = pd.to_datetime(df['date'])
              # 既存のNKD=F行を削除して最新に差し替え
              df = df[~((df['ticker'] == 'NKD=F') & (df['date'].isin(nkd['date'])))]
              cols = [c for c in df.columns if c in nkd.columns]
              df = pd.concat([df, nkd[cols]], ignore_index=True)
              df.to_parquet(fp, index=False)
              print(f'[OK] Updated futures_prices_max_1d.parquet with CME latest')
          "

          # 更新された先物価格をS3にアップロード
          if [ -f "data/parquet/futures_prices_max_1d.parquet" ]; then
            aws s3 cp "data/parquet/futures_prices_max_1d.parquet" \
              "s3://${S3_BUCKET}/${S3_PREFIX}futures_prices_max_1d.parquet" --only-show-errors
            echo "✅ Uploaded updated futures_prices_max_1d.parquet to S3"
          fi
        timeout-minutes: 5

      - name: "[CME] Publish 200A 07:00 pre-open decision"
        if: always() && steps.exec_mode.outputs.mode == 'cme_update' && (steps.check_trading_cme.outcome == 'success' || github.event.inputs.skip_trading_day_check == 'true')
        run: |
          set -euo pipefail
          echo "Publishing the frozen 200A 07:00 pre-open shadow decision"
          mkdir -p data/parquet

          aws s3 cp \
            "s3://${S3_BUCKET}/${S3_PREFIX}calendar.parquet" \
            data/parquet/calendar.parquet \
            --only-show-errors
          aws s3 cp \
            "s3://${S3_BUCKET}/${S3_PREFIX}etf_0910_us_daily.parquet" \
            data/parquet/etf_0910_us_daily.parquet \
            --only-show-errors || true

          python3 scripts/pipeline/generate_etf_0700_preopen.py
          test -s data/parquet/etf_0910_preopen.json

          aws s3 cp \
            data/parquet/etf_0910_preopen.json \
            "s3://${S3_BUCKET}/${S3_PREFIX}etf_0910_preopen.json" \
            --only-show-errors
          if [ -f data/parquet/etf_0910_us_daily.parquet ]; then
            aws s3 cp \
              data/parquet/etf_0910_us_daily.parquet \
              "s3://${S3_BUCKET}/${S3_PREFIX}etf_0910_us_daily.parquet" \
              --only-show-errors
            echo "✅ etf_0910_preopen.json and US daily cache uploaded to S3"
          else
            echo "⚠️ data_unavailable published without a US daily cache"
          fi
        timeout-minutes: 5

      - name: "[CME] Generate semicon entry decisions"
        if: steps.exec_mode.outputs.mode == 'cme_update' && (steps.check_trading_cme.outcome == 'success' || github.event.inputs.skip_trading_day_check == 'true')
        run: |
          echo "============================================================"
          echo "Generating semicon entry decisions (07:00)"
          echo "============================================================"

          aws s3 cp "s3://${S3_BUCKET}/${S3_PREFIX}prices_topix500_oc.parquet" "data/parquet/prices_topix500_oc.parquet" --only-show-errors || true
          mkdir -p data/parquet/granville
          aws s3 cp "s3://${S3_BUCKET}/${S3_PREFIX}granville/prices_topix.parquet" "data/parquet/granville/prices_topix.parquet" --only-show-errors
          aws s3 cp "s3://${S3_BUCKET}/${S3_PREFIX}futures_prices_max_1d.parquet" "data/parquet/futures_prices_max_1d.parquet" --only-show-errors || true

          python3 scripts/analysis/semiconductor/backtest_semicon_trend.py || echo "⚠️ Semicon backtest generation failed (non-fatal)"
          python3 scripts/analysis/semiconductor/generate_yf_entry_risk_report.py
          python3 scripts/pipeline/generate_semicon_api_artifacts.py --mode entry

          aws s3 cp \
            data/analysis/semicon_entry_decisions.json \
            "s3://${S3_BUCKET}/analysis/semicon_entry_decisions.json" \
            --only-show-errors
          echo "✅ semicon_entry_decisions.json uploaded to S3"

          if [ -f "scripts/analysis/semiconductor/output/ai_semiconductor_yf_entry_risk_report.html" ]; then
            aws s3 cp \
              scripts/analysis/semiconductor/output/ai_semiconductor_yf_entry_risk_report.html \
              "s3://${S3_BUCKET}/analysis/semicon_entry_risk_report.html" \
              --only-show-errors
            echo "✅ semicon_entry_risk_report.html uploaded to S3"
          fi
          if [ -f "scripts/analysis/semiconductor/output/semicon_trend_backtest_report.html" ]; then
            aws s3 cp \
              scripts/analysis/semiconductor/output/semicon_trend_backtest_report.html \
              "s3://${S3_BUCKET}/analysis/semicon_trend_backtest_report.html" \
              --only-show-errors
            echo "✅ semicon_trend_backtest_report.html uploaded to S3"
          fi
        timeout-minutes: 45

      - name: Generate market anomaly data (last trading day of week)
        if: success() && steps.exec_mode.outputs.skip_grok == 'true'
        run: |
          # 週の最終営業日かどうかを判定（J-Quantsカレンダー基準）
          if ! python3 scripts/check_last_trading_day_of_week.py; then
            echo "ℹ️  Not the last trading day of the week. Skipping market anomaly generation."
            exit 0
          fi

          echo "============================================================"
          echo "📊 Generating market anomaly data (last trading day 16:45)"
          echo "============================================================"

          python3 scripts/pipeline/generate_market_anomaly.py

          if [ $? -eq 0 ]; then
            echo "✅ Market anomaly generation completed"
          else
            echo "⚠️ Market anomaly generation failed (non-critical)"
          fi

      - name: ML Model Retraining (last trading day of week)
        if: ${{ false }}
        run: |
          # 週の最終営業日かどうかを判定（J-Quantsカレンダー基準）
          if ! python3 scripts/check_last_trading_day_of_week.py; then
            echo "ℹ️  Not the last trading day of the week. Skipping ML retraining."
            exit 0
          fi

          echo "============================================================"
          echo "🤖 ML Model Retraining (last trading day 16:45)"
          echo "============================================================"

          # === Step 1: 必要なデータをS3からダウンロード ===
          echo ""
          echo "📥 Step 1: Downloading required data from S3..."

          # grok_trending_archive.parquet
          aws s3 cp \
            "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}backtest/grok_trending_archive.parquet" \
            data/parquet/backtest/grok_trending_archive.parquet \
            --only-show-errors
          echo "  ✅ grok_trending_archive.parquet"

          # grok_prices_max_1d.parquet（S3に存在しない場合はStep 2で再生成）
          if aws s3 cp \
            "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}grok_prices_max_1d.parquet" \
            data/parquet/grok_prices_max_1d.parquet \
            --only-show-errors 2>/dev/null; then
            echo "  ✅ grok_prices_max_1d.parquet"
          else
            echo "  ⚠️ grok_prices_max_1d.parquet not found in S3 (will be generated in Step 2)"
          fi

          # index_prices_max_1d.parquet
          aws s3 cp \
            "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}index_prices_max_1d.parquet" \
            data/parquet/index_prices_max_1d.parquet \
            --only-show-errors
          echo "  ✅ index_prices_max_1d.parquet"

          # futures_prices_max_1d.parquet
          aws s3 cp \
            "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}futures_prices_max_1d.parquet" \
            data/parquet/futures_prices_max_1d.parquet \
            --only-show-errors
          echo "  ✅ futures_prices_max_1d.parquet"

          # currency_prices_max_1d.parquet
          aws s3 cp \
            "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}currency_prices_max_1d.parquet" \
            data/parquet/currency_prices_max_1d.parquet \
            --only-show-errors
          echo "  ✅ currency_prices_max_1d.parquet"

          # === Step 2: grok_prices_max_1d.parquet を更新 ===
          echo ""
          echo "📊 Step 2: Updating grok_prices_max_1d.parquet..."
          python3 scripts/pipeline/generate_grok_prices_max_1d.py

          if [ $? -eq 0 ]; then
            echo "  ✅ grok_prices_max_1d.parquet updated"
            # S3にアップロード
            aws s3 cp \
              data/parquet/grok_prices_max_1d.parquet \
              "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}grok_prices_max_1d.parquet" \
              --only-show-errors
            echo "  ✅ Uploaded to S3"
          else
            echo "  ❌ Failed to update complete Grok price history"
            exit 1
          fi

          # === Step 3: 特徴量生成 ===
          echo ""
          echo "📊 Step 3: Generating features with validated official D-1 MktCap..."
          mkdir -p data/parquet/ml
          python3 scripts/ml/feature_engineering.py

          if [ $? -eq 0 ]; then
            FEATURES_COUNT=$(python3 -c "import pandas as pd; df=pd.read_parquet('data/parquet/ml/archive_with_features.parquet'); print(len(df))")
            echo "  ✅ Generated features: $FEATURES_COUNT records"
          else
            echo "  ❌ Failed to generate features"
            exit 1
          fi

          # === Step 4: モデル学習 ===
          echo ""
          echo "🤖 Step 4: Training ML model..."
          mkdir -p models
          python3 scripts/ml/train_model.py

          if [ $? -eq 0 ]; then
            echo "  ✅ Model training completed"
          else
            echo "  ❌ Failed to train model"
            exit 1
          fi

          # 26特徴量の順序とモデル入力数を照合する。
          python3 -c 'from scripts.pipeline.add_ml_prediction_to_grok_trending import load_ml_model; load_ml_model(); print("  ✅ Local 26-feature model/meta verified")'

          # === Step 5: モデルをS3にアップロード ===
          echo ""
          echo "📤 Step 5: Uploading model to S3..."

          aws s3 cp \
            models/grok_lgbm_model.pkl \
            "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}ml/grok_lgbm_model.pkl" \
            --only-show-errors
          echo "  ✅ grok_lgbm_model.pkl"

          aws s3 cp \
            models/grok_lgbm_meta.json \
            "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}ml/grok_lgbm_meta.json" \
            --only-show-errors
          echo "  ✅ grok_lgbm_meta.json"

          # modelを先、metaを最後に置換した後、S3から再取得して
          # byte-exactであることを確認する。片方だけなら22:15推論はfail-closedになる。
          MODEL_VERIFY_DIR="/tmp/grok-model-verify-${GITHUB_RUN_ID}"
          mkdir -p "$MODEL_VERIFY_DIR"
          aws s3 cp \
            "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}ml/grok_lgbm_model.pkl" \
            "$MODEL_VERIFY_DIR/grok_lgbm_model.pkl" \
            --only-show-errors
          aws s3 cp \
            "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}ml/grok_lgbm_meta.json" \
            "$MODEL_VERIFY_DIR/grok_lgbm_meta.json" \
            --only-show-errors
          cmp models/grok_lgbm_model.pkl "$MODEL_VERIFY_DIR/grok_lgbm_model.pkl"
          cmp models/grok_lgbm_meta.json "$MODEL_VERIFY_DIR/grok_lgbm_meta.json"
          echo "  ✅ S3 model/meta byte-exact verification passed"

          # 特徴量ファイルもアップロード
          aws s3 cp \
            data/parquet/ml/archive_with_features.parquet \
            "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}ml/archive_with_features.parquet" \
            --only-show-errors
          echo "  ✅ archive_with_features.parquet"

          aws s3 cp \
            models/wfcv_predictions.parquet \
            "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}ml/wfcv_predictions.parquet" \
            --only-show-errors
          echo "  ✅ wfcv_predictions.parquet"

          # WFCV予測は派生ファイルとして保持する。正本archiveは再学習で変更しない。

          echo ""
          echo "============================================================"
          echo "✅ ML Model Retraining completed!"
          echo "============================================================"

          # ML再学習結果のSlack通知セクション生成
          python3 scripts/format_ml_slack.py || true

      - name: Generate Grok Analysis Data
        if: success() && steps.exec_mode.outputs.skip_grok == 'true'
        run: |
          echo "📊 Generating Grok Analysis Data..."

          # 出力ディレクトリ作成
          mkdir -p data/parquet/backtest

          # === Step 1: S3から必要なファイルをダウンロード ===
          echo "📥 Downloading files from S3..."

          # grok_trending_*.parquet ファイルをダウンロード
          echo "  - Downloading grok_trending_*.parquet files..."
          aws s3 sync \
            "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}backtest/" \
            data/parquet/backtest/ \
            --exclude "*" \
            --include "grok_trending_202*.parquet" \
            --only-show-errors

          GROK_FILES_COUNT=$(ls data/parquet/backtest/grok_trending_202*.parquet 2>/dev/null | wc -l)
          echo "  ✅ Downloaded $GROK_FILES_COUNT grok_trending files"

          # trading_recommendation.json をダウンロード（22:00に生成されたもの）
          echo "  - Downloading trading_recommendation.json (required)..."
          if ! aws s3 cp \
            "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}backtest/trading_recommendation.json" \
            data/parquet/backtest/trading_recommendation.json \
            --only-show-errors; then
            echo "  ❌ ERROR: trading_recommendation.json not found in S3"
            echo "  This file is required for merge_json_to_grok_analysis.py"
            echo "  Pipeline cannot proceed without this file"
            exit 1
          fi
          echo "  ✅ Downloaded trading_recommendation.json"

          # grok_trending.parquet (最新の選定結果) をダウンロード - 必須ファイル
          echo "  - Downloading grok_trending.parquet (required)..."
          if ! aws s3 cp \
            "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}grok_trending.parquet" \
            data/parquet/grok_trending.parquet \
            --only-show-errors; then
            echo "  ❌ ERROR: Failed to download grok_trending.parquet from S3"
            echo "  This file should have been created by yesterday's 22:00 Grok selection"
            echo "  Pipeline cannot proceed without this file"
            exit 1
          fi
          echo "  ✅ Downloaded grok_trending.parquet"

          # grok_trending.parquetをbacktest/にもコピー（v2.1スクリプト用）
          echo "  📋 Copying grok_trending.parquet to backtest/ directory..."
          cp data/parquet/grok_trending.parquet data/parquet/backtest/grok_trending.parquet
          echo "  ✅ Copied to backtest/"

          # === Step 2: grok_analysis_merged.parquet の生成 ===
          echo ""
          echo "📊 Step 2: Generating grok_analysis_merged.parquet..."
          echo "  ℹ️  Using merge_json_to_grok_analysis.py (49 columns with v2.0.3 logic)"

          # S3から既存のgrok_analysis_merged.parquetをダウンロード
          ANALYSIS_FILE="grok_analysis_merged.parquet"
          S3_ANALYSIS_PATH="s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}backtest/$ANALYSIS_FILE"

          if aws s3 ls "$S3_ANALYSIS_PATH" > /dev/null 2>&1; then
            echo "  📥 Downloading existing grok_analysis_merged.parquet from S3..."
            aws s3 cp "$S3_ANALYSIS_PATH" "data/parquet/backtest/$ANALYSIS_FILE" --only-show-errors
            EXISTING_RECORDS=$(python3 -c "import pandas as pd; df=pd.read_parquet('data/parquet/backtest/$ANALYSIS_FILE'); print(len(df))")
            EXISTING_DATES=$(python3 -c "import pandas as pd; df=pd.read_parquet('data/parquet/backtest/$ANALYSIS_FILE'); print(df['backtest_date'].nunique())")
            echo "  ✅ Downloaded existing file: $EXISTING_RECORDS records across $EXISTING_DATES days"
          else
            echo "  ℹ️  No existing grok_analysis_merged.parquet found in S3, will create new one"
          fi

          python3 scripts/pipeline/merge_json_to_grok_analysis.py

          if [ $? -eq 0 ]; then
            RECORDS=$(python3 -c "import pandas as pd; df = pd.read_parquet('data/parquet/backtest/grok_analysis_merged.parquet'); print(len(df))")
            COLUMNS=$(python3 -c "import pandas as pd; df = pd.read_parquet('data/parquet/backtest/grok_analysis_merged.parquet'); print(len(df.columns))")
            echo "  ✅ Generated grok_analysis_merged.parquet ($RECORDS records, $COLUMNS columns)"
          else
            echo "  ❌ Failed to run merge_json_to_grok_analysis.py"
            exit 1
          fi

          # === Step 2.5: grok_analysis_merged_v2_1.parquet の生成 ===
          echo ""
          echo "📊 Step 2.5: Generating grok_analysis_merged_v2_1.parquet..."
          echo "  ℹ️  Using update_grok_analysis_merged_v2_1.py (61 columns with v2.1 logic)"

          # S3から既存のgrok_analysis_merged_v2_1.parquetをダウンロード
          ANALYSIS_V2_1_FILE="grok_analysis_merged_v2_1.parquet"
          S3_ANALYSIS_V2_1_PATH="s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}backtest/$ANALYSIS_V2_1_FILE"

          if aws s3 ls "$S3_ANALYSIS_V2_1_PATH" > /dev/null 2>&1; then
            echo "  📥 Downloading existing grok_analysis_merged_v2_1.parquet from S3..."
            aws s3 cp "$S3_ANALYSIS_V2_1_PATH" "data/parquet/backtest/$ANALYSIS_V2_1_FILE" --only-show-errors
            EXISTING_RECORDS_V2_1=$(python3 -c "import pandas as pd; df=pd.read_parquet('data/parquet/backtest/$ANALYSIS_V2_1_FILE'); print(len(df))")
            EXISTING_DATES_V2_1=$(python3 -c "import pandas as pd; df=pd.read_parquet('data/parquet/backtest/$ANALYSIS_V2_1_FILE'); print(df['backtest_date'].nunique())")
            echo "  ✅ Downloaded existing file: $EXISTING_RECORDS_V2_1 records across $EXISTING_DATES_V2_1 days"
          else
            echo "  ℹ️  No existing grok_analysis_merged_v2_1.parquet found in S3, will create new one"
          fi

          python3 scripts/pipeline/update_grok_analysis_merged_v2_1.py

          if [ $? -eq 0 ]; then
            RECORDS_V2_1=$(python3 -c "import pandas as pd; df = pd.read_parquet('data/parquet/backtest/grok_analysis_merged_v2_1.parquet'); print(len(df))")
            COLUMNS_V2_1=$(python3 -c "import pandas as pd; df = pd.read_parquet('data/parquet/backtest/grok_analysis_merged_v2_1.parquet'); print(len(df.columns))")
            echo "  ✅ Generated grok_analysis_merged_v2_1.parquet ($RECORDS_V2_1 records, $COLUMNS_V2_1 columns)"
          else
            echo "  ❌ Failed to run update_grok_analysis_merged_v2_1.py"
            exit 1
          fi

          # === Step 3: S3にアップロード ===
          echo ""
          echo "📤 Step 3: Uploading to S3..."

          # v2.0.3のアップロード
          if aws s3 cp \
            data/parquet/backtest/grok_analysis_merged.parquet \
            "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}backtest/grok_analysis_merged.parquet" \
            --region ${{ env.AWS_REGION }} \
            --only-show-errors; then
            echo "  ✅ Uploaded grok_analysis_merged.parquet to S3"
          else
            echo "  ❌ ERROR: Failed to upload grok_analysis_merged.parquet to S3"
            exit 1
          fi

          # v2.1のアップロード
          if aws s3 cp \
            data/parquet/backtest/grok_analysis_merged_v2_1.parquet \
            "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}backtest/grok_analysis_merged_v2_1.parquet" \
            --region ${{ env.AWS_REGION }} \
            --only-show-errors; then
            echo "  ✅ Uploaded grok_analysis_merged_v2_1.parquet to S3"
          else
            echo "  ❌ ERROR: Failed to upload grok_analysis_merged_v2_1.parquet to S3"
            exit 1
          fi

          # ファイルサイズ確認
          FILE_SIZE=$(du -h data/parquet/backtest/grok_analysis_merged.parquet | cut -f1)
          echo ""
          echo "✅ Grok Analysis Data generation completed"
          echo "   File size: $FILE_SIZE"

      - name: Generate market report data
        if: success() && (steps.exec_mode.outputs.mode == 'stock_data' || steps.exec_mode.outputs.mode == 'stock_data_forced')
        run: |
          echo "============================================================"
          echo "📊 Generating market report data JSON"
          echo "============================================================"

          echo "📥 Downloading required current-day Grok report inputs from S3..."
          for f in grok_trending prices_max_1d; do
            aws s3 cp \
              "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}${f}.parquet" \
              "data/parquet/${f}.parquet" \
              --only-show-errors
          done

          # 必要なparquetがなければS3からダウンロード
          for f in index_prices_max_1d topix_prices_max_1d currency_prices_max_1d \
                   nikkei_vi_max_1d sectors_prices_max_1d futures_prices_max_1d \
                   market_anomaly; do
            FILE="data/parquet/${f}.parquet"
            if [ ! -f "$FILE" ]; then
              echo "  📥 Downloading ${f}.parquet from S3..."
              aws s3 cp "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}${f}.parquet" "$FILE" --only-show-errors || echo "  ⚠️ ${f}.parquet not found"
            fi
          done

          python3 scripts/pipeline/generate_market_report_data.py

          if [ $? -eq 0 ]; then
            echo "✅ Market report data generated"
            # S3にアップロード
            REPORT_JSON=$(ls -t data/parquet/market_summary/structured/report_data_*.json 2>/dev/null | head -1)
            if [ -n "$REPORT_JSON" ]; then
              aws s3 cp "$REPORT_JSON" "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}market_summary/structured/$(basename $REPORT_JSON)" --only-show-errors
              echo "  📤 Uploaded $(basename $REPORT_JSON) to S3"
            fi
          else
            echo "⚠️ Market report data generation failed (non-critical)"
          fi

      - name: Generate market report HTML (auto-data sections only)
        if: success() && (steps.exec_mode.outputs.mode == 'stock_data' || steps.exec_mode.outputs.mode == 'stock_data_forced')
        continue-on-error: true
        run: |
          echo "============================================================"
          echo "📄 Generating market report HTML (data sections)"
          echo "推論セクションはプレースホルダで生成。後からClaude Codeで洗い替え。"
          echo "============================================================"

          # 最新のreport_data JSONから日付を抽出
          REPORT_JSON=$(ls -t data/parquet/market_summary/structured/report_data_*.json 2>/dev/null | head -1)
          if [ -z "$REPORT_JSON" ]; then
            echo "⚠️ No report_data JSON found, skipping HTML generation"
            exit 0
          fi

          REPORT_DATE=$(basename "$REPORT_JSON" | sed -E 's/report_data_(.+)\.json/\1/')
          echo "  📅 Target date: $REPORT_DATE"

          if python3 scripts/pipeline/generate_report_html.py "$REPORT_DATE"; then
            HTML_FILE="data/reports/market_analysis_${REPORT_DATE//-/}.html"
            if [ -f "$HTML_FILE" ]; then
              # S3の reports/ プレフィックスにアップロード（FastAPIが配信する場所）
              # IAM未付与時の落下防止: アップロード失敗もnon-criticalとして握りつぶす
              if aws s3 cp "$HTML_FILE" "s3://${{ env.S3_BUCKET }}/reports/$(basename "$HTML_FILE")" --only-show-errors \
                --content-type "text/html; charset=utf-8"; then
                echo "  📤 Uploaded $(basename "$HTML_FILE") to s3://${{ env.S3_BUCKET }}/reports/"
                echo "  🔗 View at: https://ymnk.jp/api/dev/reports/$(basename "$HTML_FILE")/view"
              else
                echo "  ⚠️ S3 upload failed (IAM policy or network) - HTML generated but not published"
              fi
            else
              echo "  ⚠️ HTML file not found: $HTML_FILE"
            fi
          else
            echo "⚠️ Report HTML generation failed (non-critical)"
          fi

      - name: Check xAI billing
        if: success()
        env:
          XAI_MANAGEMENT_API_KEY: ${{ secrets.XAI_MANAGEMENT_API_KEY }}
          XAI_TEAM_ID: ${{ secrets.XAI_TEAM_ID }}
        run: |
          echo "💰 Checking xAI billing..."

          # Install requests if not already installed
          pip install requests 2>/dev/null || true

          # Run billing check script (outputs to /tmp/billing_section.txt)
          if python3 scripts/check_xai_billing.py; then
            echo "  ✅ xAI billing check completed"
          else
            echo "  ⚠️  xAI billing check failed (non-critical)"
          fi

      - name: Extract GROK stocks info
        id: grok-info
        if: success()
        run: |
          # GROK銘柄情報を抽出（S3からダウンロード）
          if aws s3 ls "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}grok_trending.parquet" > /dev/null 2>&1; then
            mkdir -p data/parquet
            aws s3 cp "s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}grok_trending.parquet" data/parquet/grok_trending.parquet --only-show-errors

            GROK_INFO=$(python3 -c '
          import pandas as pd
          import json

          df = pd.read_parquet("data/parquet/grok_trending.parquet")

          if df.empty:
              print("")
              exit(0)

          # selected_time別の集計
          time_counts = df["selected_time"].value_counts().to_dict() if "selected_time" in df.columns else {}

          # 銘柄リスト生成（全銘柄）
          stocks_list = []
          for _, row in df.iterrows():
              ticker = row.get("ticker", "")
              stock_name = row.get("stock_name", "")
              reason = row.get("reason", "")
              tags = row.get("tags", "")
              selected_time = row.get("selected_time", "")

              # reasonを100文字に切り詰め
              reason_short = reason[:100] + "..." if len(reason) > 100 else reason

              stocks_list.append({
                  "ticker": ticker,
                  "stock_name": stock_name,
                  "reason": reason_short,
                  "tags": tags,
                  "selected_time": selected_time
              })

          result = {
              "total": len(df),
              "time_counts": time_counts,
              "stocks": stocks_list
          }

          print(json.dumps(result, ensure_ascii=False))
          ' 2>/dev/null)

            # クリーンアップ
            rm -f data/parquet/grok_trending.parquet
          else
            GROK_INFO=""
          fi

          # マルチライン対応
          echo "grok_info<<EOF" >> $GITHUB_OUTPUT
          echo "$GROK_INFO" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send J-Quants market data to Slack
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_INCOMING_WEBHOOK_URL }}
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: |
          echo "📊 Sending J-Quants market data to Slack..."
          python3 scripts/format_jquants_slack.py || echo "⚠️ J-Quants Slack notification failed (non-critical)"

      - name: Send Slack notification on success
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_INCOMING_WEBHOOK_URL }}
        run: |
          TRIGGER_TIME="Manual Run"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "15 13 * * *" ]; then
              TRIGGER_TIME="22:15 JST"
            elif [ "${{ github.event.schedule }}" = "0 22 * * *" ]; then
              TRIGGER_TIME="07:00 JST (CME)"
            elif [ "${{ github.event.schedule }}" = "0 17 * * *" ]; then
              TRIGGER_TIME="02:00 JST"
            else
              TRIGGER_TIME="16:45 JST"
            fi
          fi

          # J-Quants障害検知（空ファイルかどうか）
          JQUANTS_STATUS="✅ 正常"
          if [ "${{ steps.stats.outputs.meta_jquants_count }}" = "0" ]; then
            JQUANTS_STATUS="⚠️ 障害発生（静的銘柄のみで更新）"
          fi

          # GROK銘柄情報をフォーマット（22:00のみ）
          GROK_SECTION=""
          BILLING_SECTION=""

          # xAI billing情報を読み込み
          XAI_REMAINING=""
          if [ -f "/tmp/xai_remaining.txt" ] && [ -s "/tmp/xai_remaining.txt" ]; then
            XAI_REMAINING=$(cat /tmp/xai_remaining.txt)
          fi
          if [ -f "/tmp/billing_section.txt" ] && [ -s "/tmp/billing_section.txt" ]; then
            BILLING_SECTION=",$(cat /tmp/billing_section.txt)"
          fi

          # ML Retraining (last trading day of week)
          ML_SECTION=""
          if [ -f "/tmp/ml_section.txt" ] && [ -s "/tmp/ml_section.txt" ]; then
            ML_SECTION=$(cat /tmp/ml_section.txt)
          fi

          # 22:00 または force_grok=true → GROK銘柄を表示
          if [ "${{ github.event.schedule }}" = "0 13 * * *" ] || [ "${{ github.event.inputs.force_grok }}" = "true" ]; then
            GROK_INFO='${{ steps.grok-info.outputs.grok_info }}'

            if [ -n "$GROK_INFO" ] && [ "$GROK_INFO" != "null" ]; then
              # 別ファイルのPythonスクリプトでフォーマット（YAMLエスケープ問題を回避）
              python3 scripts/format_grok_slack.py "$GROK_INFO"

              # ファイルから読み込み
              if [ -f "/tmp/grok_section.txt" ] && [ -s "/tmp/grok_section.txt" ]; then
                GROK_SECTION=$(cat /tmp/grok_section.txt)
              fi
            fi
          fi

          # タイトル構築
          SLACK_TITLE="✅ Data Pipeline Succeeded"
          if [ -n "$XAI_REMAINING" ]; then
            SLACK_TITLE="${SLACK_TITLE} | xAI: ${XAI_REMAINING}"
          fi

          MESSAGE='{
            "text": "'"${SLACK_TITLE}"'",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "✅ *Data Pipeline Succeeded*\nWorkflow `${{ github.workflow }}` completed successfully."
                }
              },
              {
                "type": "section",
                "fields": [
                  {"type": "mrkdwn", "text": "*Branch:*\n`${{ github.ref_name }}`"},
                  {"type": "mrkdwn", "text": "*Trigger:*\n`'"${TRIGGER_TIME}"'`"},
                  {"type": "mrkdwn", "text": "*J-Quants:*\n'"${JQUANTS_STATUS}"'"},
                  {"type": "mrkdwn", "text": "*Latest Price Date:*\n`${{ steps.stats.outputs.latest_price_date }}`"}
                ]
              },
              {
                "type": "section",
                "fields": [
                  {"type": "mrkdwn", "text": "*meta_jquants:*\n`${{ steps.stats.outputs.meta_jquants_count }}`銘柄"},
                  {"type": "mrkdwn", "text": "*all_stocks:*\n`${{ steps.stats.outputs.all_stocks_count }}`銘柄"},
                  {"type": "mrkdwn", "text": "*grok_trending:*\n`${{ steps.stats.outputs.grok_trending_count }}`銘柄"},
                  {"type": "mrkdwn", "text": "*static_signals:*\n`removed`"}
                ]
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": {"type": "plain_text", "text": "View Workflow Run"},
                    "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                ]
              }'"$BILLING_SECTION$GROK_SECTION$ML_SECTION"'
            ]
          }'
          curl -X POST -H 'Content-type: application/json' --data "$MESSAGE" "$SLACK_WEBHOOK_URL" || true

      - name: Send Slack notification on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_INCOMING_WEBHOOK_URL }}
        run: |
          TRIGGER_TIME="Manual Run"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "0 13 * * *" ]; then
              TRIGGER_TIME="22:00 JST"
            elif [ "${{ github.event.schedule }}" = "0 22 * * *" ]; then
              TRIGGER_TIME="07:00 JST (CME)"
            elif [ "${{ github.event.schedule }}" = "0 17 * * *" ]; then
              TRIGGER_TIME="02:00 JST"
            else
              TRIGGER_TIME="16:45 JST"
            fi
          fi

          MESSAGE='{
            "text": "❌ Data Pipeline Failed",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "❌ *Data Pipeline Failed*\nWorkflow `${{ github.workflow }}` encountered an error."
                }
              },
              {
                "type": "section",
                "fields": [
                  {"type": "mrkdwn", "text": "*Branch:*\n`${{ github.ref_name }}`"},
                  {"type": "mrkdwn", "text": "*Trigger:*\n`'"${TRIGGER_TIME}"'`"},
                  {"type": "mrkdwn", "text": "*Event:*\n`${{ github.event_name }}`"}
                ]
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "⚠️ *Action Required*\nPlease check the workflow logs and investigate the failure."
                }
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": {"type": "plain_text", "text": "View Workflow Run"},
                    "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                ]
              }
            ]
          }'
          curl -X POST -H 'Content-type: application/json' --data "$MESSAGE" "$SLACK_WEBHOOK_URL" || true

  deploy:
    name: Build and Push to ECR
    needs: pipeline
    if: success() && github.event.inputs.skip_deploy != 'true'
    runs-on: ubuntu-latest
    environment: AWS_OIDC

    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'stock-api' }}
      ECR_REPO: ${{ vars.ECR_REPO }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build Docker image with both tags
          docker build -t ${{ env.ECR_REPO }}:$IMAGE_TAG .
          docker build -t ${{ env.ECR_REPO }}:latest .

          # Push both tags to ECR
          docker push ${{ env.ECR_REPO }}:$IMAGE_TAG
          docker push ${{ env.ECR_REPO }}:latest

          echo "image=${{ env.ECR_REPO }}:$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "✅ Pushed image: ${{ env.ECR_REPO }}:$IMAGE_TAG"
          echo "✅ Pushed image: ${{ env.ECR_REPO }}:latest"
          echo ""
          echo "🚀 App Runner will automatically deploy the new image."
          echo "📢 Deployment completion notification will be sent via EventBridge → Lambda → Slack"
